database:
  # sqlite is the default and stores data in the plugin data folder.
  type: sqlite
  sqlite:
    file: player-titles.db
  mysql:
    host: localhost
    port: 3306
    database: player_titles
    username: player_titles
    password: ""
    maximum-pool-size: 4

titles:
  # Text values are raw MiniMessage templates. Player-aware rendering should apply
  # PlaceholderAPI first, then MiniMessage, because placeholders can depend on the player.
  # <status> is reserved for a future internal MiniMessage tag supplied through a TagResolver.
  adventurer:
    display-name: "<green>Adventurer</green>"
    prefix: "<dark_gray>[<green>Adventurer</green><dark_gray>]"
    icon:
      material: COMPASS
      # Optional vanilla item_model (1.21.4+). Nexo and ItemsAdder custom items use this
      # namespaced key — no plugin IDs. Nexo default: nexo:<item_id>. ItemsAdder: <namespace>:<item_id>.
      # item-model: nexo:adventurer_icon
      name: "<green>Adventurer</green>"
      lore:
        - "<gray>A simple example title."
        - "<gray>Player: <white>%player_name%</white>"
        - ""
        - "<status>"

  veteran:
    display-name: "<gold>Veteran</gold>"
    prefix: "<dark_gray>[<gold>Veteran</gold><dark_gray>]"
    icon:
      material: CLOCK
      name: "<gold>Veteran</gold>"
      lore:
        - "<gray>An example title for testing."
        - ""
        - "<status>"

  explorer:
    display-name: "<aqua>Explorer</aqua>"
    prefix: "<dark_gray>[<aqua>Explorer</aqua><dark_gray>]"
    icon:
      material: SPYGLASS
      name: "<aqua>Explorer</aqua>"
      lore:
        - "<gray>Another generic example title."
        - "<gray>Hello, <white>%player_name%</white>."
        - ""
        - "<status>"
